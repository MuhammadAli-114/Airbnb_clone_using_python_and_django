{% extends 'main/home.html' %}

{% block title %}Review Property | Airbnb Clone{% endblock %}

{% block content %}
<style>
    .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

button {
    padding: 10px;
    background-color: #ffc107;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #e0a800;
}

</style>
    <div class="container">
        <h2>Review {{ property.name }}</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Submit Review</button>
        </form>
    </div>
{% endblock %}

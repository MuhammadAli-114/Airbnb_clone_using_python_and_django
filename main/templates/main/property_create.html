{% extends 'main/home.html' %}

{% block title %}Create Property | Airbnb Clone{% endblock %}

{% block content %}
<style>
    /* General Container Styles */
    .container {
        max-width: 800px;
        margin: 50px auto;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        font-family: 'Arial', sans-serif;
    }

    .container h2 {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 20px;
        color: #333;
    }

    /* Form Styles */
    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    form label {
        font-weight: bold;
        font-size: 16px;
        color: #555;
        margin-bottom: 5px;
    }

    form input, form select, form textarea {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
        transition: border-color 0.3s ease;
    }

    form input[type="file"] {
        padding: 3px;
    }

    form input:focus, form select:focus, form textarea:focus {
        border-color: #FF385C;
        box-shadow: 0 0 5px rgba(255, 56, 92, 0.5);
    }

    /* Button Styles */
    button {
        padding: 12px;
        font-size: 16px;
        color: #fff;
        background-color: #FF385C;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
        text-align: center;
    }

    button:hover {
        background-color: #E03350;
        transform: scale(1.05);
    }

    button:active {
        background-color: #C32C45;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .container {
            padding: 20px;
        }

        .container h2 {
            font-size: 24px;
        }

        button {
            font-size: 14px;
            padding: 10px;
        }
    }
</style>

    <div class="container">
        <h2>Create Property</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Create Property</button>
        </form>
    </div>
{% endblock %}
